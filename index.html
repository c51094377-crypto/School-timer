<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業終了カウンター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #111827;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: min(94%, 560px);
  text-align: center;
}

h1 {
  font-size: 1.5rem;
  margin-bottom: 18px;
}

.timer {
  background: #1f2937;
  border-radius: 24px;
  padding: 26px 18px;
}

/* =========================
   数字本体
========================= */

#remaining {
  font-size: clamp(4rem, 18vw, 7rem);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  min-height: 1.1em;
  display: flex;
  justify-content: center;
  align-items: center;
}


/* =========================
   ① 電光掲示板
========================= */

.display-led {
  font-family: monospace;
  letter-spacing: 0.08em;
  text-shadow:
    0 0 4px currentColor,
    0 0 12px currentColor;
}


/* =========================
   ② デジタルタイマー
========================= */

.display-digital {
  font-family: "Courier New", monospace;
  font-weight: 700 !important;
  letter-spacing: 0.03em;
}


/* =========================
   ③ 計器タイマー
========================= */

.gauge {
  position: relative;
  width: min(72vw, 320px);
  aspect-ratio: 1;
  margin: 0 auto;
  border: 8px solid #4b5563;
  border-radius: 50%;
  background: #111827;
  display: flex !important;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.gauge::before {
  content: "";
  position: absolute;
  inset: 12%;
  border: 2px solid #6b7280;
  border-radius: 50%;
}

.gauge-value {
  position: relative;
  z-index: 3;
  font-family: monospace;
  font-size: clamp(2.7rem, 12vw, 5rem);
  font-weight: 800;
}

.gauge-needle {
  position: absolute;
  width: 4px;
  height: 39%;
  background: #f87171;
  bottom: 50%;
  left: calc(50% - 2px);
  transform-origin: bottom center;
  transform: rotate(-135deg);
  transition: transform 0.2s linear;
  z-index: 2;
}

.gauge-center {
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #d1d5db;
  z-index: 4;
}


/* =========================
   ④ 前に倒れる数字
========================= */

.display-flip {
  perspective: 700px;
}

.flip-number {
  display: inline-block;
  transform-origin: center bottom;
  animation: forwardFall 0.35s ease-out;
}

@keyframes forwardFall {
  0% {
    transform: rotateX(75deg);
    opacity: 0.2;
  }

  100% {
    transform: rotateX(0deg);
    opacity: 1;
  }
}


/* =========================
   ⑤ パタパタ
========================= */

.flap-display {
  display: flex !important;
  justify-content: center;
  align-items: center;
  gap: 5px;
  perspective: 900px;
}

.flap-digit {
  position: relative;
  width: 0.65em;
  height: 1em;
  font-family: monospace;
  font-size: clamp(4rem, 18vw, 7rem);
  font-weight: 800;
  line-height: 1;
  background: #111827;
  border-radius: 7px;
  overflow: hidden;
}

.flap-top,
.flap-bottom {
  position: absolute;
  left: 0;
  width: 100%;
  height: 50%;
  overflow: hidden;
  background: #374151;
  display: flex;
  justify-content: center;
}

.flap-top {
  top: 0;
  align-items: flex-end;
  transform-origin: center bottom;
  z-index: 3;
}

.flap-bottom {
  bottom: 0;
  align-items: flex-start;
  z-index: 1;
}

.flap-top span {
  transform: translateY(50%);
}

.flap-bottom span {
  transform: translateY(-50%);
}

.flap-line {
  position: absolute;
  left: 0;
  top: 50%;
  width: 100%;
  height: 3px;
  background: #111827;
  z-index: 5;
}

.flap-digit.animating .flap-top {
  animation: flapDown 0.28s ease-in forwards;
}

@keyframes flapDown {
  0% {
    transform: rotateX(0deg);
  }

  100% {
    transform: rotateX(-90deg);
  }
}


/* =========================
   共通UI
========================= */

.label {
  color: #9ca3af;
  margin-bottom: 8px;
}

#status {
  margin-top: 15px;
  color: #d1d5db;
}

.progress {
  width: 100%;
  height: 14px;
  background: #374151;
  border-radius: 999px;
  overflow: hidden;
  margin: 25px 0 10px;
}

#progressBar {
  width: 0%;
  height: 100%;
  background: #60a5fa;
  transition: width 0.2s linear;
}

#percent {
  color: #9ca3af;
  font-size: 0.9rem;
}

.choice-title {
  text-align: left;
  margin-top: 24px;
  margin-bottom: 8px;
  color: #d1d5db;
  font-size: 0.9rem;
}

.animation-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

button {
  min-height: 48px;
  border: none;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: bold;
  cursor: pointer;
}

.lesson {
  background: #374151;
  color: white;
}

.lesson.active {
  background: #2563eb;
}

.start {
  width: 100%;
  background: #16a34a;
  color: white;
  margin-top: 12px;
}

.reset {
  width: 100%;
  background: #4b5563;
  color: white;
  margin-top: 10px;
}

.info {
  margin-top: 18px;
  font-size: 0.8rem;
  color: #9ca3af;
}

@media (max-width: 400px) {
  .animation-buttons {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>📚 授業終了カウンター</h1>

  <div class="timer">

    <div class="label">授業終了まで</div>

    <div id="remaining">--:--</div>

    <div id="status">
      授業時間を選択してください
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <div id="percent">
      進捗 0%
    </div>


    <!-- 授業時間 -->

    <div class="choice-title">
      授業時間
    </div>

    <div class="animation-buttons">

      <button id="lesson50" class="lesson">
        50分
      </button>

      <button id="lesson45" class="lesson">
        45分
      </button>

    </div>


    <!-- 数字アニメーション -->

    <div class="choice-title">
      数字表示
    </div>

    <div class="animation-buttons">

      <button id="animLed" class="lesson">
        電光掲示板
      </button>

      <button id="animDigital" class="lesson">
        デジタルタイマー
      </button>

      <button id="animGauge" class="lesson">
        計器タイマー
      </button>

      <button id="animForward" class="lesson">
        前に倒れる
      </button>

      <button id="animFlap" class="lesson">
        パタパタ
      </button>

    </div>


    <button id="start" class="start">
      授業開始
    </button>

    <button id="reset" class="reset">
      リセット
    </button>

    <div class="info">
      電源OFF・ページを閉じても、再起動時に現在時刻から再計算します。
    </div>

  </div>

</div>


<script>

const remaining = document.getElementById("remaining");
const statusText = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
const percentText = document.getElementById("percent");

const lesson50 = document.getElementById("lesson50");
const lesson45 = document.getElementById("lesson45");

const startButton = document.getElementById("start");
const resetButton = document.getElementById("reset");

const animButtons = {
  led: document.getElementById("animLed"),
  digital: document.getElementById("animDigital"),
  gauge: document.getElementById("animGauge"),
  forward: document.getElementById("animForward"),
  flap: document.getElementById("animFlap")
};

let selectedMinutes = null;
let selectedAnimation = "digital";
let timer = null;
let previousDisplay = "";


/* =========================
   授業時間
========================= */

lesson50.addEventListener("click", () => {

  selectedMinutes = 50;

  lesson50.classList.add("active");
  lesson45.classList.remove("active");

});


lesson45.addEventListener("click", () => {

  selectedMinutes = 45;

  lesson45.classList.add("active");
  lesson50.classList.remove("active");

});


/* =========================
   アニメーション選択
========================= */

Object.keys(animButtons).forEach(type => {

  animButtons[type].addEventListener("click", () => {

    selectedAnimation = type;

    Object.values(animButtons).forEach(button => {
      button.classList.remove("active");
    });

    animButtons[type].classList.add("active");

    renderDisplay(
      previousDisplay || "--:--",
      true
    );

  });

});


/* =========================
   パタパタ数字生成
========================= */

function createFlapDisplay(text) {

  const wrapper = document.createElement("div");

  wrapper.className = "flap-display";

  for (const char of text) {

    if (char === ":") {

      const colon = document.createElement("div");

      colon.style.fontSize = "clamp(3rem, 14vw, 5rem)";
      colon.style.fontWeight = "800";
      colon.textContent = ":";

      wrapper.appendChild(colon);

      continue;
    }


    const digit = document.createElement("div");

    digit.className = "flap-digit";


    const top = document.createElement("div");

    top.className = "flap-top";


    const topSpan = document.createElement("span");

    topSpan.textContent = char;

    top.appendChild(topSpan);


    const bottom = document.createElement("div");

    bottom.className = "flap-bottom";


    const bottomSpan = document.createElement("span");

    bottomSpan.textContent = char;

    bottom.appendChild(bottomSpan);


    const line = document.createElement("div");

    line.className = "flap-line";


    digit.appendChild(top);
    digit.appendChild(bottom);
    digit.appendChild(line);

    wrapper.appendChild(digit);

  }

  return wrapper;
}


/* =========================
   表示切り替え
========================= */

function renderDisplay(text, force = false) {

  if (!force && text === previousDisplay) {
    return;
  }

  previousDisplay = text;


  /* 計器 */

  if (selectedAnimation === "gauge") {

    remaining.className = "gauge";

    remaining.innerHTML = "";

    const value = document.createElement("div");

    value.className = "gauge-value";

    value.textContent = text;

    const needle = document.createElement("div");

    needle.className = "gauge-needle";

    const center = document.createElement("div");

    center.className = "gauge-center";


    let seconds = 0;

    if (text !== "--:--") {

      const parts = text.split(":");

      if (parts.length === 2) {
        seconds =
          Number(parts[0]) * 60 +
          Number(parts[1]);
      }

    }

    const total =
      Number(localStorage.getItem("classDuration") || 50) * 60;

    const ratio =
      Math.max(0, Math.min(1, seconds / total));

    const angle =
      -135 + (1 - ratio) * 270;

    needle.style.transform =
      "rotate(" + angle + "deg)";

    remaining.appendChild(needle);
    remaining.appendChild(center);
    remaining.appendChild(value);

    return;
  }


  /* パタパタ */

  if (selectedAnimation === "flap") {

    remaining.className = "";

    const newDisplay =
      createFlapDisplay(text);

    remaining.replaceChildren(newDisplay);

    requestAnimationFrame(() => {

      newDisplay
        .querySelectorAll(".flap-digit")
        .forEach(digit => {

          digit.classList.add("animating");

        });

    });

    return;
  }


  /* 前に倒れる */

  if (selectedAnimation === "forward") {

    remaining.className =
      "display-flip";

    remaining.innerHTML =
      '<span class="flip-number">' +
      text +
      '</span>';

    return;
  }


  /* 電光掲示板 */

  if (selectedAnimation === "led") {

    remaining.className =
      "display-led";

    remaining.textContent =
      text;

    return;
  }


  /* デジタルタイマー */

  remaining.className =
    "display-digital";

  remaining.textContent =
    text;

}


/* =========================
   タイマー
========================= */

function updateTimer() {

  const startTime =
    Number(localStorage.getItem("classStartTime"));

  const duration =
    Number(localStorage.getItem("classDuration"));


  if (!startTime || !duration) {

    renderDisplay("--:--");

    statusText.textContent =
      "授業時間を選択してください";

    return;

  }


  const now = Date.now();

  const durationMs =
    duration * 60 * 1000;

  const endTime =
    startTime + durationMs;

  const remainingMs =
    endTime - now;


  if (remainingMs <= 0) {

    renderDisplay("00:00");

    statusText.textContent =
      "🎉 授業終了！";

    progressBar.style.width =
      "100%";

    percentText.textContent =
      "進捗 100%";

    clearInterval(timer);

    return;

  }


  const totalSeconds =
    Math.ceil(remainingMs / 1000);

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    totalSeconds % 60;


  const display =
    String(minutes).padStart(2, "0")
    + ":"
    + String(seconds).padStart(2, "0");


  renderDisplay(display);


  /* 進捗 */

  const elapsed =
    now - startTime;

  const progress =
    Math.min(
      100,
      Math.max(
        0,
        elapsed / durationMs * 100
      )
    );


  progressBar.style.width =
    progress + "%";

  percentText.textContent =
    "進捗 " + progress.toFixed(1) + "%";

  statusText.textContent =
    duration + "分授業";

}


/* =========================
   授業開始
========================= */

startButton.addEventListener("click", () => {

  if (!selectedMinutes) {

    alert(
      "45分または50分を選択してください。"
    );

    return;

  }


  const startTime =
    Date.now();


  localStorage.setItem(
    "classStartTime",
    String(startTime)
  );

  localStorage.setItem(
    "classDuration",
    String(selectedMinutes)
  );


  clearInterval(timer);

  updateTimer();

  timer =
    setInterval(updateTimer, 200);

});


/* =========================
   リセット
========================= */

resetButton.addEventListener("click", () => {

  localStorage.removeItem(
    "classStartTime"
  );

  localStorage.removeItem(
    "classDuration"
  );

  clearInterval(timer);

  previousDisplay = "";

  renderDisplay("--:--", true);

  statusText.textContent =
    "授業時間を選択してください";

  progressBar.style.width =
    "0%";

  percentText.textContent =
    "進捗 0%";

});


/* =========================
   復元
========================= */

function restoreTimer() {

  const savedStart =
    localStorage.getItem(
      "classStartTime"
    );

  const savedDuration =
    localStorage.getItem(
      "classDuration"
    );


  if (!savedStart || !savedDuration) {

    animButtons.digital.classList.add("active");

    renderDisplay("--:--", true);

    return;

  }


  selectedMinutes =
    Number(savedDuration);


  if (selectedMinutes === 50) {
    lesson50.classList.add("active");
  }

  if (selectedMinutes === 45) {
    lesson45.classList.add("active");
  }


  updateTimer();

  timer =
    setInterval(updateTimer, 200);

}


/* 初期設定 */

animButtons.digital.classList.add("active");

restoreTimer();

</script>

</body>
</html>
