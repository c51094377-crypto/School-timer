<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業終了カウンター</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    width: min(900px, 95vw);
    text-align: center;
}

h1 {
    margin-bottom: 20px;
    font-size: clamp(22px, 4vw, 36px);
}

#timer {
    font-size: clamp(70px, 18vw, 180px);
    font-weight: bold;
    letter-spacing: 8px;
    margin: 20px 0;
    min-height: 1.2em;
}

/* =========================
   通常表示
========================= */

.led {
    color: #ff2222;
    text-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 30px #ff0000;
    font-family: monospace;
}

.digital {
    color: #00ff66;
    font-family: monospace;
}

.gauge {
    color: #00bfff;
    font-family: monospace;
    text-shadow: 0 0 15px #00bfff;
}

.flip-front {
    color: white;
    font-family: monospace;
}

/* =========================
   パタパタ時計
========================= */

.flap-container {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.flap-digit {
    position: relative;
    width: clamp(65px, 15vw, 140px);
    height: clamp(90px, 20vw, 190px);
    perspective: 700px;
    font-family: monospace;
    font-weight: bold;
    font-size: clamp(65px, 16vw, 150px);
    line-height: 1;
}

.flap-half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    background: #202020;
    border: 1px solid #444;
    box-shadow: 0 3px 8px rgba(0,0,0,.5);
}

/* 上半分 */
.flap-top {
    top: 0;
    transform-origin: bottom center;
    z-index: 3;
}

/* 下半分 */
.flap-bottom {
    bottom: 0;
    z-index: 1;
}

/*
数字を半分だけ見せる
*/
.flap-top span,
.flap-bottom span {
    position: absolute;
    left: 0;
    width: 100%;
    height: 200%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.flap-top span {
    top: 0;
}

.flap-bottom span {
    bottom: 0;
}

/* 真ん中の境界線 */
.flap-digit::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 3px;
    background: #080808;
    z-index: 10;
}

/* パタッと倒れるアニメーション */
.flap-top.flipping {
    animation: flapDown 0.55s cubic-bezier(.4,0,.7,1) forwards;
}

@keyframes flapDown {
    0% {
        transform: rotateX(0deg);
        filter: brightness(1);
    }

    70% {
        filter: brightness(.65);
    }

    100% {
        transform: rotateX(-90deg);
        filter: brightness(.35);
    }
}

/* =========================
   UI
========================= */

.controls {
    margin-top: 25px;
}

button,
select {
    font-size: 16px;
    padding: 10px 16px;
    margin: 5px;
    border-radius: 8px;
    border: none;
}

button {
    cursor: pointer;
}

.progress {
    width: 100%;
    height: 12px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 20px;
}

#progressBar {
    height: 100%;
    width: 100%;
    background: #00cc66;
    transition: width .2s linear;
}

#percent {
    margin-top: 8px;
    color: #aaa;
}

/* =========================
   表示方式メニュー
========================= */

#displayMenu {
    position: fixed;
    right: 15px;
    bottom: 15px;
    z-index: 100;
}

#displayButton {
    background: #292929;
    color: white;
    border: 1px solid #555;
}

#displayPanel {
    display: none;
    position: absolute;
    right: 0;
    bottom: 50px;
    width: 220px;
    background: #222;
    border: 1px solid #555;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 5px 30px rgba(0,0,0,.6);
}

#displayPanel button {
    width: 100%;
    background: #333;
    color: white;
    margin: 4px 0;
}

#displayPanel button:hover {
    background: #444;
}

.testButton {
    background: #0066cc !important;
}

/* =========================
   スマホ・iPad向け
========================= */

@media (max-width: 600px) {
    .flap-container {
        gap: 5px;
    }

    .progress {
        height: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>授業終了カウンター</h1>

    <div id="timer">50:00</div>

    <div class="controls">

        <button onclick="startClass(50)">
            50分授業開始
        </button>

        <button onclick="startClass(45)">
            45分授業開始
        </button>

        <button onclick="resetClass()">
            リセット
        </button>

    </div>

    <div class="progress">
        <div id="progressBar"></div>
    </div>

    <div id="percent">100%</div>

</div>


<!-- 表示方式 -->
<div id="displayMenu">

    <button id="displayButton" onclick="toggleDisplayPanel()">
        ⚙ 表示方式
    </button>

    <div id="displayPanel">

        <button onclick="changeDisplay('led')">
            1. 電光掲示板
        </button>

        <button onclick="changeDisplay('digital')">
            2. デジタルタイマー
        </button>

        <button onclick="changeDisplay('gauge')">
            3. 計器タイマー
        </button>

        <button onclick="changeDisplay('flip-front')">
            4. 数字を前に倒す
        </button>

        <button onclick="changeDisplay('flap')">
            5. パタパタ
        </button>

        <button class="testButton" onclick="startTest()">
            ▶ パタパタをテスト
        </button>

    </div>

</div>


<script>

let classStartTime = null;
let classEndTime = null;
let classDuration = null;

let displayMode =
    localStorage.getItem("displayMode") || "led";

let testRunning = false;


/* =========================
   授業開始
========================= */

function startClass(minutes) {

    classDuration = minutes * 60 * 1000;

    classStartTime = Date.now();
    classEndTime = classStartTime + classDuration;

    localStorage.setItem(
        "classStartTime",
        classStartTime
    );

    localStorage.setItem(
        "classEndTime",
        classEndTime
    );

    localStorage.setItem(
        "classDuration",
        classDuration
    );

    updateTimer();
}


/* =========================
   リセット
========================= */

function resetClass() {

    localStorage.removeItem("classStartTime");
    localStorage.removeItem("classEndTime");
    localStorage.removeItem("classDuration");

    classStartTime = null;
    classEndTime = null;
    classDuration = null;

    showTime(0);
}


/* =========================
   保存データ復元
========================= */

function restoreClass() {

    const savedStart =
        localStorage.getItem("classStartTime");

    const savedEnd =
        localStorage.getItem("classEndTime");

    const savedDuration =
        localStorage.getItem("classDuration");

    if (
        savedStart &&
        savedEnd &&
        savedDuration
    ) {

        classStartTime = Number(savedStart);
        classEndTime = Number(savedEnd);
        classDuration = Number(savedDuration);

    } else {

        showTime(0);
    }
}


/* =========================
   タイマー更新
========================= */

function updateTimer() {

    if (
        !classEndTime ||
        !classDuration
    ) {
        return;
    }

    const now = Date.now();

    let remaining =
        classEndTime - now;

    if (remaining < 0) {
        remaining = 0;
    }

    showTime(remaining);

    const percentage =
        (remaining / classDuration) * 100;

    document.getElementById("progressBar")
        .style.width =
        percentage + "%";

    document.getElementById("percent")
        .textContent =
        Math.ceil(percentage) + "%";
}


/* =========================
   時間表示
========================= */

function showTime(ms) {

    let totalSeconds =
        Math.ceil(ms / 1000);

    if (totalSeconds < 0) {
        totalSeconds = 0;
    }

    const minutes =
        Math.floor(totalSeconds / 60);

    const seconds =
        totalSeconds % 60;

    const text =
        String(minutes).padStart(2, "0")
        + ":" +
        String(seconds).padStart(2, "0");

    if (displayMode === "flap") {

        updateFlap(text);

    } else {

        const timer =
            document.getElementById("timer");

        timer.className = displayMode;

        timer.textContent = text;
    }
}


/* =========================
   表示方式変更
========================= */

function changeDisplay(mode) {

    displayMode = mode;

    localStorage.setItem(
        "displayMode",
        mode
    );

    const timer =
        document.getElementById("timer");

    if (mode === "flap") {

        createFlapDigits();

        if (classEndTime) {
            updateTimer();
        } else {
            updateFlap("00:00");
        }

    } else {

        timer.innerHTML = "";

        timer.className = mode;

        if (classEndTime) {
            updateTimer();
        } else {
            timer.textContent = "00:00";
        }
    }

    document.getElementById("displayPanel")
        .style.display = "none";
}


/* =========================
   メニュー
========================= */

function toggleDisplayPanel() {

    const panel =
        document.getElementById("displayPanel");

    panel.style.display =
        panel.style.display === "block"
        ? "none"
        : "block";
}


/* =========================
   パタパタ数字を作る
========================= */

function createFlapDigits() {

    const timer =
        document.getElementById("timer");

    timer.className = "";

    timer.innerHTML =
        '<div class="flap-container">' +

        '<div class="flap-digit" data-digit="0">' +
            '<div class="flap-half flap-top">' +
                '<span>0</span>' +
            '</div>' +
            '<div class="flap-half flap-bottom">' +
                '<span>0</span>' +
            '</div>' +
        '</div>' +

        '<div class="flap-digit" data-digit="0">' +
            '<div class="flap-half flap-top">' +
                '<span>0</span>' +
            '</div>' +
            '<div class="flap-half flap-bottom">' +
                '<span>0</span>' +
            '</div>' +
        '</div>' +

        '<div style="font-size:0.7em;display:flex;align-items:center;">:</div>' +

        '<div class="flap-digit" data-digit="0">' +
            '<div class="flap-half flap-top">' +
                '<span>0</span>' +
            '</div>' +
            '<div class="flap-half flap-bottom">' +
                '<span>0</span>' +
            '</div>' +
        '</div>' +

        '<div class="flap-digit" data-digit="0">' +
            '<div class="flap-half flap-top">' +
                '<span>0</span>' +
            '</div>' +
            '<div class="flap-half flap-bottom">' +
                '<span>0</span>' +
            '</div>' +
        '</div>' +

        '</div>';
}


/* =========================
   パタパタ更新
========================= */

function updateFlap(timeText) {

    if (
        !document.querySelector(".flap-digit")
    ) {
        createFlapDigits();
    }

    const digits =
        timeText.replace(":", "").split("");

    const boxes =
        document.querySelectorAll(".flap-digit");

    boxes.forEach((box, index) => {

        const newDigit =
            digits[index];

        const oldDigit =
            box.dataset.digit || "0";

        if (newDigit === oldDigit) {
            return;
        }

        flipDigit(
            box,
            oldDigit,
            newDigit
        );
    });
}


/* =========================
   1桁のパタパタ処理
========================= */

function flipDigit(box, oldDigit, newDigit) {

    const top =
        box.querySelector(".flap-top");

    const bottom =
        box.querySelector(".flap-bottom");

    const topSpan =
        top.querySelector("span");

    const bottomSpan =
        bottom.querySelector("span");


    /*
     * 重要：
     * 最初は上下とも「現在の数字」
     */

    topSpan.textContent = oldDigit;
    bottomSpan.textContent = oldDigit;


    /*
     * 新しい数字の上半分を
     * 裏側に準備しておく
     */
    const nextTop =
        document.createElement("span");

    nextTop.textContent = newDigit;

    nextTop.style.display = "flex";
    nextTop.style.position = "absolute";
    nextTop.style.left = "0";
    nextTop.style.top = "0";
    nextTop.style.width = "100%";
    nextTop.style.height = "200%";
    nextTop.style.justifyContent = "center";
    nextTop.style.alignItems = "center";

    /*
     * アニメーション用の上半分
     */
    top.innerHTML = "";

    top.appendChild(nextTop);

    top.classList.remove("flipping");

    /*
     * 再描画してからアニメーション開始
     */
    void top.offsetWidth;

    top.classList.add("flipping");


    /*
     * ここが重要。
     *
     * 上半分が -90deg になって
     * 下半分と完全に重なった瞬間に
     * 初めて数字を変更する。
     */
    setTimeout(() => {

        /*
         * 下半分を新しい数字へ変更
         */
        bottomSpan.textContent = newDigit;

        /*
         * 上半分を新しい数字に戻す
         */
        top.classList.remove("flipping");

        top.innerHTML =
            '<span>' +
            newDigit +
            '</span>';

        /*
         * 次の状態を保存
         */
        box.dataset.digit = newDigit;

    }, 550);
}


/* =========================
   テストアニメーション
========================= */

function startTest() {

    if (testRunning) {
        return;
    }

    testRunning = true;

    displayMode = "flap";

    localStorage.setItem(
        "displayMode",
        "flap"
    );

    createFlapDigits();

    let seconds = 10;

    updateFlap(
        "00:" +
        String(seconds).padStart(2, "0")
    );

    const testTimer =
        setInterval(() => {

            seconds--;

            if (seconds < 0) {

                clearInterval(testTimer);

                testRunning = false;

                return;
            }

            updateFlap(
                "00:" +
                String(seconds).padStart(2, "0")
            );

        }, 1000);
}


/* =========================
   起動時
========================= */

restoreClass();

changeDisplay(displayMode);


/* =========================
   定期更新
========================= */

setInterval(() => {

    if (!testRunning) {
        updateTimer();
    }

}, 200);


/* =========================
   ページ復帰時
========================= */

window.addEventListener(
    "pageshow",
    () => {
        updateTimer();
    }
);

window.addEventListener(
    "focus",
    () => {
        updateTimer();
    }
);

</script>

</body>
</html>
