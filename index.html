<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業終了カウンター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111827;
  color: white;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: min(94%, 560px);
  text-align: center;
}

h1 {
  font-size: 1.5rem;
  margin-bottom: 18px;
}

.timer {
  position: relative;
  background: #1f2937;
  border-radius: 24px;
  padding: 28px 20px 70px;
}

.label {
  color: #9ca3af;
  margin-bottom: 8px;
}

#display {
  height: 125px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-variant-numeric: tabular-nums;
}

.digits {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
}

.digit {
  position: relative;
  width: 70px;
  height: 100px;
  font-size: 78px;
  font-weight: 800;
  line-height: 100px;
  perspective: 500px;
}

.colon {
  width: 25px;
  font-size: 65px;
  font-weight: 800;
}


/* ===============================
   電光掲示板
================================ */

.led .digit {
  color: #ff4d4d;
  text-shadow:
    0 0 5px #ff4d4d,
    0 0 12px #ff4d4d;
  font-family: monospace;
}

.led .digit::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 5px,
      rgba(0,0,0,.18) 6px,
      transparent 7px
    );
  pointer-events: none;
}


/* ===============================
   デジタルタイマー
================================ */

.digital .digit {
  font-family: "Courier New", monospace;
  background: #050505;
  border: 2px solid #374151;
  border-radius: 8px;
  color: #f3f4f6;
  box-shadow: inset 0 0 15px #000;
}


/* ===============================
   計器タイマー
================================ */

.gauge .digit {
  width: 78px;
  height: 78px;
  line-height: 70px;
  font-size: 55px;
  border-radius: 50%;
  border: 4px solid #6b7280;
  background: #111827;
  box-shadow:
    inset 0 0 0 5px #1f2937,
    inset 0 0 20px #000;
}

.gauge .colon {
  font-size: 45px;
}


/* ===============================
   前に倒れる数字
================================ */

.flip-front .digit {
  transform-style: preserve-3d;
}

.flip-front .digit.animate {
  animation:
    frontFlip .55s ease-in-out;
}

@keyframes frontFlip {

  0% {
    transform: rotateX(0deg);
  }

  45% {
    transform: rotateX(-90deg);
  }

  100% {
    transform: rotateX(0deg);
  }

}


/* ==================================================
   パタパタ式
   上半分だけが倒れる
================================================== */

.flap {
  gap: 7px;
}

.flap .digit {
  width: 65px;
  height: 96px;
  font-size: 70px;
  line-height: 96px;
  background: transparent;
  border-radius: 5px;
  overflow: visible;
  position: relative;
  transform-style: preserve-3d;
}


/* 真ん中の境界線 */

.flap .digit::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 48px;
  height: 2px;
  background: #000;
  z-index: 10;
}


/*
   上半分
   現在の数字を表示
*/

.flap .digit .flap-top {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 50%;

  background: #080808;

  border-radius: 5px 5px 0 0;

  overflow: hidden;

  transform-origin: bottom center;

  transform-style: preserve-3d;

  z-index: 4;
}


/*
   上半分に表示する数字
*/

.flap .digit .flap-top-number {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 96px;

  line-height: 96px;

  text-align: center;

  font-weight: 800;
}


/*
   下半分
   こちらは絶対に動かさない
*/

.flap .digit .flap-bottom {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 50%;

  background: #080808;

  border-radius: 0 0 5px 5px;

  overflow: hidden;

  z-index: 2;
}


/*
   下半分の数字
*/

.flap .digit .flap-bottom-number {
  position: absolute;
  left: 0;
  bottom: 0;

  width: 100%;
  height: 96px;

  line-height: 96px;

  text-align: center;

  font-weight: 800;
}


/*
   上半分が手前に倒れる
*/

.flap .digit.flipping .flap-top {
  animation:
    flapTopDown .65s ease-in-out;
}


@keyframes flapTopDown {

  0% {
    transform:
      rotateX(0deg);
    z-index: 6;
  }

  45% {
    transform:
      rotateX(-90deg);
    z-index: 6;
  }

  50% {
    transform:
      rotateX(-90deg);
    z-index: 6;
  }

  100% {
    transform:
      rotateX(0deg);
    z-index: 6;
  }

}


/* ===============================
   プログレス
================================ */

.progress {
  width: 100%;
  height: 14px;
  background: #374151;
  border-radius: 999px;
  overflow: hidden;
  margin: 25px 0 10px;
}

#progressBar {
  width: 0%;
  height: 100%;
  background: #60a5fa;
}

#percent {
  color: #9ca3af;
  font-size: .9rem;
}


/* ===============================
   ボタン
================================ */

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 22px;
}

button {
  flex: 1;
  min-height: 50px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
}

.lesson {
  background: #374151;
  color: white;
}

.lesson.active {
  background: #2563eb;
}

.start {
  background: #16a34a;
  color: white;
}

.reset {
  width: 100%;
  margin-top: 12px;
  background: #4b5563;
  color: white;
}


/* ===============================
   表示方式メニュー
================================ */

.display-menu {
  position: absolute;
  right: 15px;
  bottom: 15px;
}

.display-button {
  min-height: 42px;
  padding: 8px 14px;
  background: #374151;
  color: white;
  border: 1px solid #6b7280;
  border-radius: 10px;
  font-size: .85rem;
}

.display-panel {
  display: none;

  position: absolute;

  right: 0;
  bottom: 52px;

  width: 235px;

  padding: 12px;

  background: #111827;

  border: 1px solid #4b5563;

  border-radius: 14px;

  z-index: 20;
}

.display-panel.open {
  display: block;
}

.display-panel button {
  width: 100%;
  margin: 4px 0;

  min-height: 42px;

  background: #1f2937;
  color: white;

  text-align: left;

  padding: 0 12px;
}

.test-button {
  margin-top: 10px !important;
  border-top: 1px solid #4b5563 !important;
}


/* ===============================
   情報
================================ */

.info {
  margin-top: 17px;
  color: #9ca3af;
  font-size: .82rem;
}

@media(max-width:450px) {

  #display {
    transform: scale(.82);
  }

  .timer {
    padding-left: 8px;
    padding-right: 8px;
  }

}
</style>
</head>


<body>

<div class="container">

<h1>📚 授業終了カウンター</h1>

<div class="timer">

  <div class="label">
    授業終了まで
  </div>


  <div id="display" class="digital">

    <div class="digits">

      <div class="digit" id="d1">0</div>

      <div class="digit" id="d2">0</div>

      <div class="colon">:</div>

      <div class="digit" id="d3">0</div>

      <div class="digit" id="d4">0</div>

    </div>

  </div>


  <div id="status">
    授業時間を選択してください
  </div>


  <div class="progress">

    <div id="progressBar"></div>

  </div>


  <div id="percent">
    進捗 0%
  </div>


  <div class="buttons">

    <button id="lesson50" class="lesson">
      50分
    </button>

    <button id="lesson45" class="lesson">
      45分
    </button>

  </div>


  <div class="buttons">

    <button id="start" class="start">
      授業開始
    </button>

  </div>


  <button id="reset" class="reset">
    リセット
  </button>


  <!-- 表示方式 -->

  <div class="display-menu">

    <button id="displayButton"
            class="display-button">
      ⚙ 表示方式
    </button>


    <div id="displayPanel"
         class="display-panel">

      <button data-mode="led">
        📟 電光掲示板
      </button>

      <button data-mode="digital">
        🔢 デジタルタイマー
      </button>

      <button data-mode="gauge">
        🎛️ 計器タイマー
      </button>

      <button data-mode="flip-front">
        🔄 数字を前に倒す
      </button>

      <button data-mode="flap">
        ⬇️ パタパタ
      </button>

      <button id="testAnimation"
              class="test-button">
        ▶ 試験アニメーション
      </button>

    </div>

  </div>


  <div class="info">
    電源OFF・ページを閉じても
    再起動時に自動復元します。
  </div>

</div>

</div>


<script>

/* ==========================================
   要素
========================================== */

const display =
  document.getElementById("display");

const statusText =
  document.getElementById("status");

const progressBar =
  document.getElementById("progressBar");

const percentText =
  document.getElementById("percent");

const lesson50 =
  document.getElementById("lesson50");

const lesson45 =
  document.getElementById("lesson45");

const startButton =
  document.getElementById("start");

const resetButton =
  document.getElementById("reset");

const displayButton =
  document.getElementById("displayButton");

const displayPanel =
  document.getElementById("displayPanel");

const testAnimation =
  document.getElementById("testAnimation");


const digits = [

  document.getElementById("d1"),
  document.getElementById("d2"),
  document.getElementById("d3"),
  document.getElementById("d4")

];


let selectedMinutes = null;

let timer = null;

let displayMode =
  localStorage.getItem("displayMode")
  || "digital";

let lastText = "";


/* ==========================================
   表示方式
========================================== */

function applyDisplayMode() {

  display.className = "";

  display.classList.add(
    displayMode
  );


  /*
     パタパタ方式に変更された時、
     通常の数字を専用構造へ変換
  */

  if (displayMode === "flap") {

    createFlapDigits();

  } else {

    restoreNormalDigits();

  }

}


function createFlapDigits() {

  digits.forEach((digit, index) => {

    if (index === 2) return;

    if (digit.dataset.flapReady) return;

    const value =
      digit.textContent || "0";


    digit.innerHTML = "";


    const top =
      document.createElement("div");

    top.className =
      "flap-top";


    const topNumber =
      document.createElement("div");

    topNumber.className =
      "flap-top-number";

    topNumber.textContent =
      value;


    top.appendChild(
      topNumber
    );


    const bottom =
      document.createElement("div");

    bottom.className =
      "flap-bottom";


    const bottomNumber =
      document.createElement("div");

    bottomNumber.className =
      "flap-bottom-number";

    bottomNumber.textContent =
      value;


    bottom.appendChild(
      bottomNumber
    );


    digit.appendChild(top);

    digit.appendChild(bottom);

    digit.dataset.flapReady =
      "true";

  });

}


function restoreNormalDigits() {

  digits.forEach((digit, index) => {

    if (index === 2) return;

    const value =
      digit.dataset.value || "0";

    digit.innerHTML = "";

    digit.textContent =
      value;

    delete digit.dataset.flapReady;

  });

}


/* ==========================================
   表示方式メニュー
========================================== */

displayButton.addEventListener(
  "click",
  () => {

    displayPanel.classList.toggle(
      "open"
    );

  }
);


document
.querySelectorAll("[data-mode]")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      displayMode =
        button.dataset.mode;

      localStorage.setItem(
        "displayMode",
        displayMode
      );

      displayPanel.classList.remove(
        "open"
      );

      applyDisplayMode();

      showTime(
        lastText.slice(0,2) || "00",
        lastText.slice(2) || "00",
        true
      );

    }
  );

});


/* ==========================================
   通常数字更新
========================================== */

function showTime(
  minutes,
  seconds,
  force = false
) {

  const text =
    String(minutes).padStart(2,"0") +
    String(seconds).padStart(2,"0");


  if (
    !force &&
    text === lastText
  ) {

    return;

  }


  lastText = text;


  if (
    displayMode === "flap"
  ) {

    updateFlap(text);

    return;

  }


  digits.forEach(
    (digit,index) => {

      if (index === 2) return;

      digit.dataset.value =
        text[index];

      digit.textContent =
        text[index];

    }
  );

}


/* ==========================================
   パタパタ更新
========================================== */

function updateFlap(text) {

  createFlapDigits();


  digits.forEach(
    (digit,index) => {

      if (index === 2) return;


      const newValue =
        text[index];


      const top =
        digit.querySelector(
          ".flap-top"
        );

      const bottom =
        digit.querySelector(
          ".flap-bottom"
        );


      const topNumber =
        digit.querySelector(
          ".flap-top-number"
        );

      const bottomNumber =
        digit.querySelector(
          ".flap-bottom-number"
        );


      const oldValue =
        digit.dataset.value || "0";


      if (
        oldValue === newValue
      ) {

        return;

      }


      /*
        現在の数字を上半分に表示。
        下半分は新しい数字に変更しておく。
      */

      topNumber.textContent =
        oldValue;

      bottomNumber.textContent =
        newValue;


      digit.classList.remove(
        "flipping"
      );

      void digit.offsetWidth;


      /*
        上半分だけを倒す
      */

      digit.classList.add(
        "flipping"
      );


      digit.dataset.value =
        newValue;


      setTimeout(() => {

        /*
          アニメーション終了後、
          上半分も新しい数字へ。
        */

        topNumber.textContent =
          newValue;

        digit.classList.remove(
          "flipping"
        );

      },650);

    }
  );

}


/* ==========================================
   試験アニメーション
========================================== */

testAnimation.addEventListener(
  "click",
  () => {

    displayPanel.classList.remove(
      "open"
    );


    /*
       10秒 → 0秒
       1秒ごとにカウントダウン
    */

    let value = 10;


    showTime(
      0,
      value,
      true
    );


    const testTimer =
      setInterval(() => {

        value--;


        showTime(
          0,
          value,
          true
        );


        if (value <= 0) {

          clearInterval(
            testTimer
          );

        }

      },1000);

  }
);


/* ==========================================
   授業時間選択
========================================== */

lesson50.addEventListener(
  "click",
  () => {

    selectedMinutes = 50;

    lesson50.classList.add(
      "active"
    );

    lesson45.classList.remove(
      "active"
    );

  }
);


lesson45.addEventListener(
  "click",
  () => {

    selectedMinutes = 45;

    lesson45.classList.add(
      "active"
    );

    lesson50.classList.remove(
      "active"
    );

  }
);


/* ==========================================
   タイマー
========================================== */

function updateTimer() {

  const startTime =
    Number(
      localStorage.getItem(
        "classStartTime"
      )
    );


  const duration =
    Number(
      localStorage.getItem(
        "classDuration"
      )
    );


  if (
    !startTime ||
    !duration
  ) {

    showTime(0,0);

    statusText.textContent =
      "授業時間を選択してください";

    progressBar.style.width =
      "0%";

    percentText.textContent =
      "進捗 0%";

    return;

  }


  const now =
    Date.now();


  const durationMs =
    duration * 60 * 1000;


  const endTime =
    startTime + durationMs;


  const remainingMs =
    endTime - now;


  if (
    remainingMs <= 0
  ) {

    showTime(0,0);

    statusText.textContent =
      "🎉 授業終了！";

    progressBar.style.width =
      "100%";

    percentText.textContent =
      "進捗 100%";

    clearInterval(timer);

    timer = null;

    return;

  }


  const totalSeconds =
    Math.ceil(
      remainingMs / 1000
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  showTime(
    minutes,
    seconds
  );


  const elapsed =
    now - startTime;


  const progress =
    Math.min(
      100,
      Math.max(
        0,
        elapsed / durationMs * 100
      )
    );


  progressBar.style.width =
    progress + "%";


  percentText.textContent =
    "進捗 " +
    progress.toFixed(1) +
    "%";


  statusText.textContent =
    duration +
    "分授業";

}


/* ==========================================
   授業開始
========================================== */

startButton.addEventListener(
  "click",
  () => {

    if (!selectedMinutes) {

      alert(
        "45分または50分を選択してください。"
      );

      return;

    }


    localStorage.setItem(
      "classStartTime",
      String(Date.now())
    );


    localStorage.setItem(
      "classDuration",
      String(selectedMinutes)
    );


    clearInterval(timer);


    updateTimer();


    timer =
      setInterval(
        updateTimer,
        200
      );

  }
);


/* ==========================================
   リセット
========================================== */

resetButton.addEventListener(
  "click",
  () => {

    localStorage.removeItem(
      "classStartTime"
    );

    localStorage.removeItem(
      "classDuration"
    );


    clearInterval(timer);

    timer = null;

    lastText = "";


    showTime(
      0,
      0,
      true
    );


    statusText.textContent =
      "授業時間を選択してください";


    progressBar.style.width =
      "0%";


    percentText.textContent =
      "進捗 0%";

  }
);


/* ==========================================
   復元
========================================== */

function restoreTimer() {

  const savedStart =
    localStorage.getItem(
      "classStartTime"
    );


  const savedDuration =
    localStorage.getItem(
      "classDuration"
    );


  if (
    !savedStart ||
    !savedDuration
  ) {

    applyDisplayMode();

    return;

  }


  selectedMinutes =
    Number(savedDuration);


  if (
    selectedMinutes === 50
  ) {

    lesson50.classList.add(
      "active"
    );

  }


  if (
    selectedMinutes === 45
  ) {

    lesson45.classList.add(
      "active"
    );

  }


  applyDisplayMode();


  updateTimer();


  timer =
    setInterval(
      updateTimer,
      200
    );

}


/* ==========================================
   起動
========================================== */

restoreTimer();

</script>

</body>
</html>
```
