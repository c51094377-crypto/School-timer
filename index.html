<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業終了カウンター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111827;
  color: white;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: min(94%, 560px);
  text-align: center;
}

h1 {
  font-size: 1.5rem;
  margin-bottom: 18px;
}

.timer {
  position: relative;
  background: #1f2937;
  border-radius: 24px;
  padding: 28px 20px 70px;
  overflow: hidden;
}

.label {
  color: #9ca3af;
  margin-bottom: 8px;
}

/* =================================
   共通数字
================================= */

#display {
  height: 125px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-variant-numeric: tabular-nums;
}

.digits {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.digit {
  position: relative;
  width: 70px;
  height: 100px;
  font-size: 78px;
  font-weight: 800;
  line-height: 100px;
  perspective: 400px;
}

.colon {
  width: 25px;
  font-size: 65px;
  font-weight: 800;
}


/* =================================
   1. 電光掲示板
================================= */

.led .digit {
  color: #ff4d4d;
  text-shadow:
    0 0 5px #ff4d4d,
    0 0 12px #ff4d4d;
  font-family: monospace;
}

.led .digit::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 5px,
    rgba(0,0,0,.18) 6px,
    transparent 7px
  );
  pointer-events: none;
}


/* =================================
   2. デジタルタイマー
================================= */

.digital .digit {
  font-family: "Courier New", monospace;
  background: #050505;
  border: 2px solid #374151;
  border-radius: 8px;
  color: #f3f4f6;
  box-shadow: inset 0 0 15px #000;
}

.digital .colon {
  color: #f3f4f6;
}


/* =================================
   3. 計器タイマー
================================= */

.gauge {
  display: flex;
  align-items: center;
  gap: 8px;
}

.gauge .digit {
  width: 78px;
  height: 78px;
  line-height: 78px;
  font-size: 55px;
  border-radius: 50%;
  border: 4px solid #6b7280;
  background: #111827;
  box-shadow:
    inset 0 0 0 5px #1f2937,
    inset 0 0 20px #000;
}

.gauge .colon {
  font-size: 45px;
}


/* =================================
   4. 前に倒れる数字
================================= */

.flip-front .digit {
  transform-style: preserve-3d;
}

.flip-front .digit.animate {
  animation: frontFlip .55s ease-in-out;
}

@keyframes frontFlip {
  0% {
    transform: rotateX(0deg);
  }

  45% {
    transform: rotateX(-90deg);
  }

  100% {
    transform: rotateX(0deg);
  }
}


/* =================================
   5. パタパタ
================================= */

.flap {
  gap: 7px;
}

.flap .digit {
  width: 65px;
  height: 96px;
  line-height: 96px;
  font-size: 70px;
  background: #111;
  border-radius: 5px;
  overflow: hidden;
  box-shadow: 0 3px 8px #000;
}

.flap .digit::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 48%;
  height: 2px;
  background: #000;
  z-index: 5;
}

.flap .digit.animate {
  animation: flapDown .6s ease-in-out;
}

@keyframes flapDown {
  0% {
    transform: rotateX(0deg);
  }

  45% {
    transform: rotateX(-88deg);
  }

  50% {
    transform: rotateX(-88deg);
  }

  100% {
    transform: rotateX(0deg);
  }
}


/* =================================
   プログレスバー
================================= */

.progress {
  width: 100%;
  height: 14px;
  background: #374151;
  border-radius: 999px;
  overflow: hidden;
  margin: 25px 0 10px;
}

#progressBar {
  width: 0%;
  height: 100%;
  background: #60a5fa;
  transition: width .2s linear;
}

#percent {
  color: #9ca3af;
  font-size: .9rem;
}


/* =================================
   ボタン
================================= */

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 22px;
}

button {
  flex: 1;
  min-height: 50px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
}

.lesson {
  background: #374151;
  color: white;
}

.lesson.active {
  background: #2563eb;
}

.start {
  background: #16a34a;
  color: white;
}

.reset {
  width: 100%;
  margin-top: 12px;
  background: #4b5563;
  color: white;
}


/* =================================
   右下の表示選択ボタン
================================= */

.display-menu {
  position: absolute;
  right: 15px;
  bottom: 15px;
}

.display-button {
  min-height: 42px;
  padding: 8px 14px;
  background: #374151;
  color: white;
  border: 1px solid #6b7280;
  border-radius: 10px;
  font-size: .85rem;
}

.display-panel {
  display: none;
  position: absolute;
  right: 0;
  bottom: 52px;
  width: 235px;
  padding: 12px;
  background: #111827;
  border: 1px solid #4b5563;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  z-index: 20;
}

.display-panel.open {
  display: block;
}

.display-panel button {
  width: 100%;
  margin: 4px 0;
  min-height: 42px;
  background: #1f2937;
  color: white;
  text-align: left;
  padding: 0 12px;
}

.display-panel button:hover {
  background: #374151;
}

.test-button {
  border-top: 1px solid #4b5563 !important;
  margin-top: 10px !important;
  padding-top: 8px;
}


/* =================================
   情報
================================= */

.info {
  margin-top: 17px;
  color: #9ca3af;
  font-size: .82rem;
}

@media (max-width: 450px) {

  #display {
    transform: scale(.82);
  }

  .timer {
    padding-left: 8px;
    padding-right: 8px;
  }
}
</style>
</head>


<body>

<div class="container">

<h1>📚 授業終了カウンター</h1>

<div class="timer">

  <div class="label">授業終了まで</div>

  <div id="display" class="digital">

    <div class="digits">

      <div class="digit" id="d1">0</div>
      <div class="digit" id="d2">0</div>

      <div class="colon">:</div>

      <div class="digit" id="d3">0</div>
      <div class="digit" id="d4">0</div>

    </div>

  </div>

  <div id="status">
    授業時間を選択してください
  </div>

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <div id="percent">
    進捗 0%
  </div>


  <div class="buttons">

    <button id="lesson50" class="lesson">
      50分
    </button>

    <button id="lesson45" class="lesson">
      45分
    </button>

  </div>


  <div class="buttons">

    <button id="start" class="start">
      授業開始
    </button>

  </div>


  <button id="reset" class="reset">
    リセット
  </button>


  <!-- 表示方式選択 -->

  <div class="display-menu">

    <button id="displayButton" class="display-button">
      ⚙ 表示方式
    </button>

    <div id="displayPanel" class="display-panel">

      <button data-mode="led">
        📟 電光掲示板
      </button>

      <button data-mode="digital">
        🔢 デジタルタイマー
      </button>

      <button data-mode="gauge">
        🎛️ 計器タイマー
      </button>

      <button data-mode="flip-front">
        🔄 数字を前に倒す
      </button>

      <button data-mode="flap">
        ⬇️ パタパタ
      </button>

      <button id="testAnimation" class="test-button">
        ▶ 試験アニメーション
      </button>

    </div>

  </div>


  <div class="info">
    電源OFF・ページを閉じても、再起動時に自動復元します。
  </div>

</div>

</div>


<script>

/* =================================
   基本設定
================================= */

const display =
  document.getElementById("display");

const remaining =
  document.getElementById("remaining");

const statusText =
  document.getElementById("status");

const progressBar =
  document.getElementById("progressBar");

const percentText =
  document.getElementById("percent");

const lesson50 =
  document.getElementById("lesson50");

const lesson45 =
  document.getElementById("lesson45");

const startButton =
  document.getElementById("start");

const resetButton =
  document.getElementById("reset");

const displayButton =
  document.getElementById("displayButton");

const displayPanel =
  document.getElementById("displayPanel");

const testAnimation =
  document.getElementById("testAnimation");

const digits = [
  document.getElementById("d1"),
  document.getElementById("d2"),
  document.getElementById("d3"),
  document.getElementById("d4")
];

let selectedMinutes = null;
let timer = null;

let lastDisplayValue = "";


/* =================================
   表示方式
================================= */

let displayMode =
  localStorage.getItem("displayMode") || "digital";


function applyDisplayMode() {

  display.className = "";

  display.classList.add(displayMode);

}


applyDisplayMode();


/* メニュー開閉 */

displayButton.addEventListener("click", () => {

  displayPanel.classList.toggle("open");

});


/* モード選択 */

document
.querySelectorAll("[data-mode]")
.forEach(button => {

  button.addEventListener("click", () => {

    displayMode =
      button.dataset.mode;

    localStorage.setItem(
      "displayMode",
      displayMode
    );

    applyDisplayMode();

    displayPanel.classList.remove("open");

    animateDigits();

  });

});


/* =================================
   数字表示
================================= */

function showTime(minutes, seconds) {

  const text =
    String(minutes).padStart(2, "0") +
    String(seconds).padStart(2, "0");

  digits.forEach((digit, index) => {

    digit.textContent =
      text[index];

  });


  if (text !== lastDisplayValue) {

    animateDigits();

    lastDisplayValue = text;

  }

}


/* =================================
   アニメーション
================================= */

function animateDigits() {

  digits.forEach(digit => {

    digit.classList.remove("animate");

    /*
      ブラウザに一度レイアウトを認識させて
      アニメーションを再スタートする
    */

    void digit.offsetWidth;

    if (
      displayMode === "flip-front" ||
      displayMode === "flap"
    ) {

      digit.classList.add("animate");

    }

  });

}


/* =================================
   試験アニメーション
================================= */

testAnimation.addEventListener("click", () => {

  displayPanel.classList.remove("open");

  let count = 0;

  const values = [
    "5000",
    "4959",
    "4930",
    "4500",
    "3000",
    "1000",
    "0059",
    "0000"
  ];

  function testStep() {

    if (count >= values.length) {

      return;

    }

    const value =
      values[count];

    digits.forEach((digit, index) => {

      digit.textContent =
        value[index];

    });

    animateDigits();

    count++;

    setTimeout(
      testStep,
      650
    );

  }

  testStep();

});


/* =================================
   授業時間
================================= */

lesson50.addEventListener("click", () => {

  selectedMinutes = 50;

  lesson50.classList.add("active");
  lesson45.classList.remove("active");

});


lesson45.addEventListener("click", () => {

  selectedMinutes = 45;

  lesson45.classList.add("active");
  lesson50.classList.remove("active");

});


/* =================================
   タイマー計算
================================= */

function updateTimer() {

  const startTime =
    Number(
      localStorage.getItem("classStartTime")
    );

  const duration =
    Number(
      localStorage.getItem("classDuration")
    );


  if (!startTime || !duration) {

    showTime(0, 0);

    statusText.textContent =
      "授業時間を選択してください";

    progressBar.style.width =
      "0%";

    percentText.textContent =
      "進捗 0%";

    return;

  }


  const now =
    Date.now();

  const durationMs =
    duration * 60 * 1000;

  const endTime =
    startTime + durationMs;

  const remainingMs =
    endTime - now;


  /* 授業終了 */

  if (remainingMs <= 0) {

    showTime(0, 0);

    statusText.textContent =
      "🎉 授業終了！";

    progressBar.style.width =
      "100%";

    percentText.textContent =
      "進捗 100%";

    clearInterval(timer);

    timer = null;

    return;

  }


  /* 残り秒数 */

  const totalSeconds =
    Math.ceil(
      remainingMs / 1000
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );

  const seconds =
    totalSeconds % 60;


  showTime(
    minutes,
    seconds
  );


  /* 進捗 */

  const elapsed =
    now - startTime;

  const progress =
    Math.min(
      100,
      Math.max(
        0,
        elapsed / durationMs * 100
      )
    );


  progressBar.style.width =
    progress + "%";

  percentText.textContent =
    "進捗 " +
    progress.toFixed(1) +
    "%";


  statusText.textContent =
    duration +
    "分授業";
}


/* =================================
   授業開始
================================= */

startButton.addEventListener("click", () => {

  if (!selectedMinutes) {

    alert(
      "45分または50分を選択してください。"
    );

    return;

  }


  /*
    開始時刻をミリ秒で保存。

    ページを閉じても、
    電源が切れても、
    Date.now()との差から
    正確な残り時間を再計算できる。
  */

  localStorage.setItem(
    "classStartTime",
    String(Date.now())
  );

  localStorage.setItem(
    "classDuration",
    String(selectedMinutes)
  );


  clearInterval(timer);

  updateTimer();

  timer =
    setInterval(
      updateTimer,
      200
    );

});


/* =================================
   リセット
================================= */

resetButton.addEventListener("click", () => {

  localStorage.removeItem(
    "classStartTime"
  );

  localStorage.removeItem(
    "classDuration"
  );

  clearInterval(timer);

  timer = null;

  showTime(0, 0);

  statusText.textContent =
    "授業時間を選択してください";

  progressBar.style.width =
    "0%";

  percentText.textContent =
    "進捗 0%";

});


/* =================================
   再起動時の復元
================================= */

function restoreTimer() {

  const savedStart =
    localStorage.getItem(
      "classStartTime"
    );

  const savedDuration =
    localStorage.getItem(
      "classDuration"
    );


  if (!savedStart || !savedDuration) {

    return;

  }


  selectedMinutes =
    Number(savedDuration);


  if (selectedMinutes === 50) {

    lesson50.classList.add("active");

  }

  if (selectedMinutes === 45) {

    lesson45.classList.add("active");

  }


  updateTimer();


  timer =
    setInterval(
      updateTimer,
      200
    );

}


/* =================================
   起動
================================= */

restoreTimer();

</script>

</body>
</html>
```
